# nginx for the PowerConnect website

# The original scheme: on the server Traefik already did HTTPS and says so in X-Forwarded-Proto;
# locally there is no such header, so use this request's own scheme (http).
map $http_x_forwarded_proto $original_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    absolute_redirect off;    # redirects keep whatever address/port the browser used

    # Photos are sent as base64 text, so allow bigger requests (default is only 1 MB)
    client_max_body_size 10m;

    # /api/... goes to the Java API container ("api" is its name in docker-compose.yml)
    location /api/ {
        proxy_pass http://api:8088/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Tell the API it lives under /api and was reached over https (Swagger UI needs this)
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_set_header X-Forwarded-Proto $original_proto;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Database viewer (Adminer container) - for showing the tables in a demo
    location /db/ {
        proxy_pass http://adminer:8080/;
        proxy_set_header Host $host;
    }
    location = /db {
        return 302 /db/;
    }

    # Short link to the API documentation
    location = /swagger {
        return 302 /api/swagger-ui/index.html;
    }

    # Everything else is the website
    location / {
        try_files $uri /index.html;
    }
}
